[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paperrev-lab"
version = "0.5.0"
description = "REA-inspired evidence-first paper reverse engineering, code reconstruction and verification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PaperRev contributors"}]
dependencies = []

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.23"]
mcp = ["mcp>=1.8"]
all = ["PyMuPDF>=1.23", "mcp>=1.8"]

[project.scripts]
paperrev = "paperrev.engine_cli:main"
paperrev-mcp = "paperrev.mcp_server:main"
paperrev-startlux = "paperrev.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
